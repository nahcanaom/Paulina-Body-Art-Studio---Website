<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAULINA Body Art Studio | Reset Password</title>
  <link rel="icon" type="image/png" href="../../assets/logos/favicon_white.png">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../../css/sign-in.css">
</head>
<body>
  <div class="page-shell">
    <aside class="brand-panel">
      <div class="brand-meta">A STUDIO FOR SELF-EXPRESSION</div>
      <blockquote class="brand-quote">
        “Fearfully and wonderfully made.”
        <span>— Psalm 139:14</span>
      </blockquote>
    </aside>

    <main class="auth-panel">
      <section class="auth-box" aria-label="Reset password form">
        <h2>WELCOME TO THE STUDIO</h2>
        <h3>Reset Password</h3>

        <form class="auth-form" data-reset-password-form method="post" novalidate>
          <div class="field-group">
            <label for="new-password">New Password</label>
            <div class="input-wrap">
              <span class="input-icon"><i class="ph-fill ph-lock"></i></span>
              <input id="new-password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" aria-label="New Password" required minlength="8">
              <button class="password-toggle" type="button" data-password-toggle aria-controls="new-password" aria-label="Show password" aria-pressed="false">
                <i class="ph-fill ph-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="field-group">
            <label for="confirm-password">Confirm New Password</label>
            <div class="input-wrap">
              <span class="input-icon"><i class="ph-fill ph-lock"></i></span>
              <input id="confirm-password" name="confirmPassword" type="password" placeholder="Re-enter password" autocomplete="new-password" aria-label="Confirm New Password" required minlength="8">
              <button class="password-toggle" type="button" data-password-toggle aria-controls="confirm-password" aria-label="Show password" aria-pressed="false">
                <i class="ph-fill ph-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="primary-btn">UPDATE PASSWORD</button>
        </form>

        <p class="auth-message" id="reset-message" role="status" aria-live="polite"></p>
        <p class="signup-link"><a href="../html/user-side/sign-in.html">Back to sign in</a></p>
      </section>
    </main>
  </div>
  <script type="module" src="../../js/reset-password.js"></script>
</body>
</html>
